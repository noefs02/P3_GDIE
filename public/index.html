<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC & AI Chat - Multi-usuario</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <div class="app-container layout-row">
        <!-- Sector Central -->
        <main class="center-sector">
            <div class="glass-panel room-controls" style="margin-bottom: 24px; text-align: center;">
                <h2 class="side-info-title">App de Llamadas WebRTC</h2>
                <input type="text" id="username-input" placeholder="Tu Nombre">
                <input type="text" id="room-input" placeholder="Nombre de la sala" value="sala1">
                <br>
                <button id="join-btn" class="control-btn"><i class="fa-solid fa-right-to-bracket"></i> Unirse a la sala</button>
                <button id="hangup-btn" class="control-btn" style="display:none;"><i class="fa-solid fa-phone-slash"></i> Salir</button>
                <button id="camera-btn" class="control-btn" style="display:none;"><i class="fa-solid fa-video-slash"></i> Activar Cámara</button>
                <button id="mic-btn" class="control-btn" style="display:none;"><i class="fa-solid fa-microphone-slash"></i> Activar Micrófono</button>
                <button id="screen-btn" class="control-btn" style="display:none;"><i class="fa-solid fa-desktop"></i> Compartir Pantalla</button>
            </div>

            <div id="video-grid" class="video-grid">
                <!-- El localVideo se inyecta dinamicamente -->
            </div>
        </main>

        <!-- Sector Derecha -->
        <aside id="chat-sector" class="chat-section">
            <div class="glass-panel chat-container">
                <h2 class="side-info-title">Chat de Sala</h2>
                <div class="moderation-controls">
                    <label class="switch" title="Activar filtro de toxicidad con IA">
                        <input type="checkbox" id="moderation-toggle" disabled>
                        <span class="slider round"></span>
                    </label>
                    <span class="moderation-label">Moderación IA</span>
                    <span id="moderation-status" class="moderation-status"></span>
                </div>
                <div class="translation-controls" style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
                    <span class="moderation-label">Traducir entrantes a:</span>
                    <select id="translation-select" class="glass-select">
                        <option value="none">Desactivado</option>
                        <option value="es">Español</option>
                        <option value="en">Inglés</option>
                    </select>
                    <span id="translation-status" class="moderation-status"></span>
                </div>
                <div class="chat-box" id="chat-messages">
                    <div class="chat-message system">Rellena tus datos y únete a una sala.</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Escribe un mensaje..." disabled>
                    <button id="send-btn" class="control-btn" disabled><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </aside>
    </div>
</body>
</html>
